version: "3.9"
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - MOCK_LLM=true
      - DATABASE_URL=sqlite:////data/app.db
      - DATA_DIR=/data
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/data
    restart: unless-stopped

